# Request limits per visitor IP (the account API adds its own per-account limits).
limit_req_zone $binary_remote_addr zone=orbit_auth:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=orbit_api:10m rate=120r/m;

# Plain HTTP (also what visitors get when they use the server's IP address).
# deploy.sh appends an HTTPS server block when a domain is configured.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/orbit-hub;
    index index.html;
    include snippets/orbit-hub-locations.conf;
}
