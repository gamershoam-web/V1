# Shared by the HTTP and (optional) HTTPS server blocks. Installed to /etc/nginx/snippets/ by deploy.sh.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Pages, styles and scripts: always revalidate (cheap 304s via ETag) so updates show immediately.
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
location ~* \.(?:css|js|html)$ {
    add_header Cache-Control "no-cache";
}
# Large files that never change: three.js and fonts.
location ^~ /vendor/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
}
location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# Accounts and cloud saves (server/orbit_api.py, systemd service orbit-hub-api)
location /api/ {
    limit_req zone=orbit_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
# Stricter limit for password checks (the API also limits per account)
location ~ ^/api/(auth/(login|register|google|forgot|reset)|account/delete)$ {
    limit_req zone=orbit_auth burst=8 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
