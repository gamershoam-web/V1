# Optional nginx server block for the Nocturne site.
# Copy to /etc/nginx/sites-available/nocturne, adjust server_name/root,
# then: ln -s /etc/nginx/sites-available/nocturne /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← your domain
    root /var/www/html;                         # ← your web root
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets never change → cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
