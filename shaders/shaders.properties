# =====================================================================================
#  ABYSSAL PATHTRACER — shaders.properties  (OptiFine HD U H+ / Iris 1.6+)
# =====================================================================================

# ---------------------------------------------------------------- vanilla features ---
clouds = off
oldLighting = false
oldHandLight = false
dynamicHandLight = true
separateAo = true
underwaterOverlay = false
vignette = false
sun = false
moon = false
rain.depth = false
beacon.beam.depth = true
frustum.culling = true

# ---------------------------------------------------------------- shadow pass --------
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true
# the voxel volume needs every chunk around the player, not just the light frustum
shadow.culling = false
# Iris: all particles after translucents (they are forward lit into colortex4)
particles.ordering = after

# ---------------------------------------------------------------- blending -----------
blend.shadow = off
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_entities_glowing = off
blend.gbuffers_hand = off
blend.gbuffers_basic = off
blend.gbuffers_line = off
blend.gbuffers_spidereyes = off
blend.gbuffers_beaconbeam = off
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex11 = off
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex11 = off
blend.gbuffers_textured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint = ONE ONE ZERO ONE

# ---------------------------------------------------------------- alpha test ---------
alphaTest.gbuffers_terrain = off
alphaTest.gbuffers_water = off
alphaTest.gbuffers_textured = off
alphaTest.gbuffers_textured_lit = off
alphaTest.gbuffers_weather = off
alphaTest.shadow = off

# ---------------------------------------------------------------- program toggles ----
program.deferred.enabled  = PTGI
program.deferred1.enabled = PTGI
program.deferred2.enabled = PTGI && SVGF_ATROUS_PASSES >= 1 && DEBUG_VIEW != 3
program.deferred3.enabled = PTGI && SVGF_ATROUS_PASSES >= 2 && DEBUG_VIEW != 3
program.deferred4.enabled = PTGI && SVGF_ATROUS_PASSES >= 3 && DEBUG_VIEW != 3
program.deferred5.enabled = PTGI && SVGF_ATROUS_PASSES >= 4 && DEBUG_VIEW != 3
program.composite3.enabled = BLOOM
program.composite4.enabled = BLOOM
program.composite5.enabled = BLOOM
program.world-1/deferred.enabled  = PTGI
program.world-1/deferred1.enabled = PTGI
program.world1/deferred.enabled   = PTGI
program.world1/deferred1.enabled  = PTGI

# ---------------------------------------------------------------- profiles -----------
profile.UNRESTRICTED = shadowMapResolution:16384 shadowDistance:256.0 CASCADE_NEAR_RADIUS:48.0 PCSS_BLOCKER_SAMPLES:32 PCSS_FILTER_SAMPLES:64 CONTACT_SHADOWS PTGI GI_BOUNCES:8 GI_SAMPLES:1 GI_MAX_STEPS:128 VOXEL_SIZE_XZ:512 VOXEL_SIZE_Y:256 SVGF SVGF_ATROUS_PASSES:4 VOLUMETRIC_FOG VL_STEPS:256 SSR SSR_STEPS:64 RT_REFLECTIONS RT_REFLECTION_STEPS:192 POM POM_STEPS:512 POM_SHADOWS POM_SHADOW_STEPS:128 ATMOSPHERE_STEPS:24 TAA BLOOM
profile.EXTREME      = shadowMapResolution:8192 shadowDistance:256.0 CASCADE_NEAR_RADIUS:48.0 PCSS_BLOCKER_SAMPLES:24 PCSS_FILTER_SAMPLES:48 CONTACT_SHADOWS PTGI GI_BOUNCES:4 GI_SAMPLES:1 GI_MAX_STEPS:96 VOXEL_SIZE_XZ:256 VOXEL_SIZE_Y:256 SVGF SVGF_ATROUS_PASSES:4 VOLUMETRIC_FOG VL_STEPS:128 SSR SSR_STEPS:48 RT_REFLECTIONS RT_REFLECTION_STEPS:128 POM POM_STEPS:256 POM_SHADOWS POM_SHADOW_STEPS:64 ATMOSPHERE_STEPS:16 TAA BLOOM
profile.HIGH         = shadowMapResolution:4096 shadowDistance:192.0 CASCADE_NEAR_RADIUS:32.0 PCSS_BLOCKER_SAMPLES:16 PCSS_FILTER_SAMPLES:24 CONTACT_SHADOWS PTGI GI_BOUNCES:2 GI_SAMPLES:1 GI_MAX_STEPS:64 VOXEL_SIZE_XZ:256 VOXEL_SIZE_Y:128 SVGF SVGF_ATROUS_PASSES:4 VOLUMETRIC_FOG VL_STEPS:64 SSR SSR_STEPS:32 RT_REFLECTIONS RT_REFLECTION_STEPS:64 POM POM_STEPS:128 POM_SHADOWS POM_SHADOW_STEPS:32 ATMOSPHERE_STEPS:12 TAA BLOOM
profile.BALANCED     = shadowMapResolution:4096 shadowDistance:128.0 CASCADE_NEAR_RADIUS:24.0 PCSS_BLOCKER_SAMPLES:8 PCSS_FILTER_SAMPLES:16 !CONTACT_SHADOWS PTGI GI_BOUNCES:1 GI_SAMPLES:1 GI_MAX_STEPS:48 VOXEL_SIZE_XZ:128 VOXEL_SIZE_Y:128 SVGF SVGF_ATROUS_PASSES:3 VOLUMETRIC_FOG VL_STEPS:32 SSR SSR_STEPS:24 !RT_REFLECTIONS RT_REFLECTION_STEPS:64 POM POM_STEPS:64 !POM_SHADOWS POM_SHADOW_STEPS:16 ATMOSPHERE_STEPS:8 TAA BLOOM

# ---------------------------------------------------------------- menu ---------------
screen = <profile> <empty> [SHADOWS_SCREEN] [GI_SCREEN] [ATMOS_SCREEN] [REFLECTION_SCREEN] [WATER_SCREEN] [MATERIAL_SCREEN] [CAMERA_SCREEN] [DEBUG_SCREEN]
screen.columns = 2

screen.SHADOWS_SCREEN = SHADOWS COLORED_SHADOWS shadowMapResolution shadowDistance CASCADE_NEAR_RADIUS sunPathRotation <empty> <empty> PCSS_BLOCKER_SAMPLES PCSS_FILTER_SAMPLES SUN_ANGULAR_RADIUS PCSS_MAX_PENUMBRA PCSS_MIN_PENUMBRA <empty> CONTACT_SHADOWS CONTACT_SHADOW_STEPS CONTACT_SHADOW_LENGTH <empty> WATER_CAUSTICS CAUSTICS_STRENGTH
screen.GI_SCREEN = PTGI <empty> GI_BOUNCES GI_SAMPLES GI_MAX_STEPS GI_RUSSIAN_ROULETTE VOXEL_SIZE_XZ VOXEL_SIZE_Y GI_SKY_STRENGTH GI_SUN_STRENGTH EMISSION_STRENGTH LIGHTMAP_BLOCKLIGHT <empty> <empty> [SVGF_SCREEN]
screen.SVGF_SCREEN = SVGF <empty> SVGF_TEMPORAL_FRAMES SVGF_ATROUS_PASSES SVGF_PHI_COLOR SVGF_PHI_NORMAL SVGF_PHI_DEPTH
screen.ATMOS_SCREEN = VOLUMETRIC_FOG FOG_NOISE VL_STEPS VL_DISTANCE FOG_DENSITY FOG_ANISOTROPY FOG_HEIGHT FOG_FALLOFF RAIN_FOG ATMOSPHERE_STEPS <empty> <empty> SUN_ILLUMINANCE MOON_ILLUMINANCE SKY_BRIGHTNESS STARS
screen.REFLECTION_SCREEN = SSR RT_REFLECTIONS SSR_STEPS SSR_REFINE RT_REFLECTION_STEPS ROUGH_REFLECTION_THRESHOLD
screen.WATER_SCREEN = WATER_WAVES <empty> WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION WATER_ABSORPTION WATER_SCATTERING
screen.MATERIAL_SCREEN = LABPBR HARDCODED_EMISSION POM POM_SHADOWS POM_STEPS POM_SHADOW_STEPS POM_DEPTH POM_DISTANCE <empty> <empty> SPECULAR_AA NORMAL_MAP_STRENGTH SPECULAR_AA_VARIANCE SPECULAR_AA_THRESHOLD VANILLA_AO <empty> SSS SSS_STRENGTH SSS_DEPTH <empty> WAVING_PLANTS WAVING_SPEED
screen.CAMERA_SCREEN = TAA TAA_BLEND AUTO_EXPOSURE EXPOSURE EXPOSURE_SPEED <empty> BLOOM BLOOM_STRENGTH TONEMAP_SATURATION TONEMAP_CONTRAST
screen.DEBUG_SCREEN = DEBUG_VIEW

sliders = shadowMapResolution shadowDistance sunPathRotation CASCADE_NEAR_RADIUS PCSS_BLOCKER_SAMPLES PCSS_FILTER_SAMPLES SUN_ANGULAR_RADIUS PCSS_MAX_PENUMBRA PCSS_MIN_PENUMBRA CONTACT_SHADOW_STEPS CONTACT_SHADOW_LENGTH CAUSTICS_STRENGTH \
          GI_BOUNCES GI_SAMPLES GI_MAX_STEPS VOXEL_SIZE_XZ VOXEL_SIZE_Y GI_SKY_STRENGTH GI_SUN_STRENGTH EMISSION_STRENGTH GI_RUSSIAN_ROULETTE LIGHTMAP_BLOCKLIGHT \
          SVGF_TEMPORAL_FRAMES SVGF_ATROUS_PASSES SVGF_PHI_COLOR SVGF_PHI_NORMAL SVGF_PHI_DEPTH \
          VL_STEPS VL_DISTANCE FOG_DENSITY FOG_HEIGHT FOG_FALLOFF FOG_ANISOTROPY ATMOSPHERE_STEPS RAIN_FOG \
          SSR_STEPS SSR_REFINE RT_REFLECTION_STEPS ROUGH_REFLECTION_THRESHOLD \
          WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION WATER_ABSORPTION WATER_SCATTERING \
          POM_STEPS POM_DEPTH POM_DISTANCE POM_SHADOW_STEPS SPECULAR_AA_VARIANCE SPECULAR_AA_THRESHOLD NORMAL_MAP_STRENGTH VANILLA_AO SSS_STRENGTH SSS_DEPTH WAVING_SPEED \
          TAA_BLEND EXPOSURE EXPOSURE_SPEED BLOOM_STRENGTH TONEMAP_SATURATION TONEMAP_CONTRAST SUN_ILLUMINANCE MOON_ILLUMINANCE SKY_BRIGHTNESS DEBUG_VIEW
