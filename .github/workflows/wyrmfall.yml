name: WYRMFALL

on:
  push:
    paths:
      - "wyrmfall/**"
      - ".github/workflows/wyrmfall.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the .mrpack"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wyrmfall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and boot-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests (offline)
        run: python wyrmfall/tests/test_build.py

      - name: Resolve mods on Modrinth and build .mrpack
        run: python wyrmfall/tools/build.py --out dist

      - name: Upload .mrpack and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WYRMFALL-modpack
          path: dist/
          if-no-files-found: warn

      - name: Assemble Forge server from the .mrpack
        run: python wyrmfall/tools/make_server.py dist/*.mrpack --out server --memory 5G

      - name: Boot the server and check WYRMFALL content
        run: python wyrmfall/tools/smoke_test.py server

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server/logs/
            server/crash-reports/
            server/smoke-console.log
          if-no-files-found: ignore

      - name: Read pack version
        id: meta
        run: echo "version=$(python -c "import json;print(json.load(open('wyrmfall/pack.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wyrmfall-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WYRMFALL ${{ steps.meta.outputs.version }}
          body_path: dist/report.md
          files: dist/*.mrpack
