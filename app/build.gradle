plugins {
    id 'com.android.application'
}

android {
    namespace 'com.v1.voicechanger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.v1.voicechanger'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly.
            // Replace with your own signingConfig before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
}
