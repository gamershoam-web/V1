<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V1 Live Wallpaper</title>
<style>
html,body{margin:0;height:100%;background:#060a10;overflow:hidden;cursor:default}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="assets/chrome.js"></script>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var style = q.get("style") || "chrome";
  var fps = Math.max(10, Math.min(60, +q.get("fps") || 30));
  var still = q.get("still") === "1";
  // Wallpaper composition: the chrome sits right of centre so desktop icons on the left stay readable.
  var fx = V1Chrome(document.getElementById("c"), {
    style: style, fps: fps, cx: 0.30, cy: 0.02, size: 1.05,
    scale: still ? 1 : (+q.get("scale") || 0.6), mouse: false, still: still, time: +q.get("t") || 7.5
  });
  var paused = false;
  function play() { if (!still && !paused) { fx.start(); } }

  if (still) { fx.frame(+q.get("t") || 7.5); document.title = "ready"; return; }
  fx.frame();
  play();

  var wv = window.chrome && window.chrome.webview;
  if (wv) {
    wv.addEventListener("message", function (e) {
      var m = e.data;
      if (m === "pause") { paused = true; fx.stop(); }
      else if (m === "play") { paused = false; play(); }
      else if (m && typeof m === "object") {
        if (m.fps) { fx.set("fps", Math.max(10, Math.min(60, +m.fps))); }
        if (m.style) { fx.set("style", m.style); }
      }
    });
  }
  // Never burn GPU while the page is hidden (session locked, display off).
  document.addEventListener("visibilitychange", function () { if (document.hidden) { fx.stop(); } else { play(); } });
})();
</script>
</body>
</html>
